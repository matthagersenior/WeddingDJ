name: WeddingDJ Live Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-diagnose.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live WeddingDJ
        shell: bash
        run: |
          set +e
          BASE='https://weddingdj.matthagersr.workers.dev'
          health=$(curl -sS -o /tmp/health -w '%{http_code}' "$BASE/health")
          guest=$(curl -sS -o /tmp/guest -w '%{http_code}' "$BASE/e/michael-marisa")
          setup=$(curl -sS -o /tmp/setup -w '%{http_code}' "$BASE/setup")
          echo "health=$health guest=$guest setup=$setup"
          echo "hero=$(grep -c 'data-carousel=\"hero\"' /tmp/guest || true)"
          echo "gallery=$(grep -c 'data-carousel=\"gallery\"' /tmp/guest || true)"
          echo "setup_photo=$(grep -c 'auth-photo' /tmp/setup || true)"
          echo '--- guest prefix ---'
          head -c 1200 /tmp/guest || true
          echo
          echo '--- photo statuses ---'
          failed=0
          for i in 0 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/photo-$i -w '%{http_code}' "$BASE/media/wedding/$i.jpeg")
            ctype=$(curl -sSI "$BASE/media/wedding/$i.jpeg" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -1)
            size=$(wc -c </tmp/photo-$i)
            echo "photo_$i status=$code type=${ctype:-unknown} bytes=$size"
            [ "$code" = "200" ] || failed=1
          done
          echo '--- setup prefix ---'
          head -c 600 /tmp/setup || true
          echo
          exit $failed
