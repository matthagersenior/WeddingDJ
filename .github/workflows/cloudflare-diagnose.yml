name: Cloudflare Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Show Cloudflare account visible to token
        run: npx wrangler whoami
      - name: List D1 databases visible to token
        run: npx wrangler d1 list
