name: Apply WeddingDJ Host Login Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-host-login.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch host login behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/worker.ts')
          text = p.read_text()

          old_guest = "body = body.replace(/<\\/main>\\s*<script>/, `${weddingGallery()}</main><script>`);"
          new_guest = "body = body.replace(/<\\/main>\\s*<script>/, `${weddingGallery()}<footer class=\"host-login-footer\"><span>Hosting the reception?</span><a class=\"host-login-link\" href=\"/auth/login\">Host Login</a></footer></main><script>`);"
          if old_guest not in text:
              raise SystemExit('guest enhancement anchor not found')
          text = text.replace(old_guest, new_guest, 1)

          css_anchor = "@media(max-width:740px){"
          footer_css = ".host-login-footer{max-width:670px;margin:1.5rem auto .25rem;padding:1rem 1.1rem;display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap;color:var(--muted);font-size:.82rem}.host-login-link{color:var(--ink);font-weight:800;text-underline-offset:3px}.host-login-link:hover{color:var(--gold)}\n"
          if css_anchor not in text:
              raise SystemExit('photo CSS anchor not found')
          text = text.replace(css_anchor, footer_css + css_anchor, 1)

          fetch_anchor = "    const url = new URL(req.url);\n\n    const photoMatch = url.pathname.match(/^\\/media\\/wedding\\/([0-5])\\.jpeg$/);"
          setup_guard = "    const url = new URL(req.url);\n\n    if (url.pathname === '/setup' && req.method === 'GET') {\n      const existing = await env.DB.prepare('SELECT COUNT(*) AS c FROM users').first<{ c: number }>();\n      if ((existing?.c || 0) > 0) return new Response(null, { status: 302, headers: { Location: '/auth/login' } });\n    }\n\n    const photoMatch = url.pathname.match(/^\\/media\\/wedding\\/([0-5])\\.jpeg$/);"
          if fetch_anchor not in text:
              raise SystemExit('fetch setup anchor not found')
          text = text.replace(fetch_anchor, setup_guard, 1)

          p.write_text(text)
          PY
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.ts
          git commit -m "Add host login link and one-time setup redirect"
          git push
